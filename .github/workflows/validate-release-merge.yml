name: Validate release merge

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches:
      - main

jobs:
  validate-release-merge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          cache: true

      - name: Install dev_tools dependencies
        run: dart pub get -C dev_tools

      - name: Validate release candidates are complete
        run: >
          dart run dev_tools/bin/dev_tools.dart validate-release-mr
          --to ${{ github.event.pull_request.base.sha }}
